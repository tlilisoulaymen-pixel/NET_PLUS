<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0A0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NetPlus" />
  <title>NetPlus — Espace Opérateur</title>
  <link rel="manifest" href="/assets/netplus/pwa/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/netplus/pwa/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-root: #0A0A0B;
      --bg-primary: #0F0F10;
      --bg-surface: #18181B;
      --bg-elevated: #27272A;
      --bg-hover: #3F3F46;
      --border: #27272A;
      --border-light: #3F3F46;
      --emerald: #10b981;
      --emerald-light: #34d399;
      --emerald-glow: rgba(16, 185, 129, 0.2);
      --emerald-bg: rgba(16, 185, 129, 0.1);
      --amber: #f59e0b;
      --amber-light: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --rose: #ef4444;
      --rose-bg: rgba(239, 68, 68, 0.1);
      --cyan: #06b6d4;
      --cyan-bg: rgba(6, 182, 212, 0.1);
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.1);
      --text-primary: #E4E4E7;
      --text-muted: #A1A1AA;
      --text-dim: #71717A;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
    }

    :root {
      background: var(--bg-root);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100%;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #app { min-height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; padding: 16px; gap: 16px; }

    /* ── Splash ── */
    #splash {
      position: fixed; inset: 0; background: var(--bg-root);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      z-index: 1000; transition: opacity 0.4s;
    }
    #splash .logo-box { width: 56px; height: 56px; background: var(--emerald); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; color: #000; box-shadow: 0 0 40px var(--emerald-glow); letter-spacing: -2px; }
    #splash .brand { font-size: 1.2rem; font-weight: 800; color: white; letter-spacing: -0.5px; margin-top: 8px; }
    #splash .brand span { color: var(--emerald); }
    #splash .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--emerald); border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error State ── */
    .error-state { text-align: center; padding: 60px 20px; }
    .error-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .error-state h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .error-state p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }
    .error-state a { color: var(--emerald); text-decoration: none; font-weight: 600; }

    /* ── User Header Card ── */
    .user-header {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 20px; border-radius: var(--radius-xl);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .user-header .top-row { display: flex; align-items: center; justify-content: space-between; }
    .user-header .user-info { display: flex; align-items: center; gap: 12px; }
    .user-header .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--emerald); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; color: #000; box-shadow: 0 0 0 3px rgba(16,185,129,0.3); }
    .user-header .user-name { font-weight: 700; font-size: 1rem; color: white; display: flex; align-items: center; gap: 6px; }
    .user-header .user-name .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); animation: pulse-dot 2s infinite; }
    .user-header .user-label { font-size: 0.75rem; color: var(--emerald); font-weight: 500; }
    .gps-badge { font-size: 0.65rem; font-family: monospace; color: var(--text-muted); background: var(--bg-primary); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); }
    @keyframes pulse-dot { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

    /* ── Tab Toggle ── */
    .tab-toggle {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--bg-primary); padding: 4px; border-radius: var(--radius);
      border: 1px solid var(--border); font-size: 0.75rem; font-weight: 700;
      margin-top: 16px;
    }
    .tab-toggle button {
      padding: 10px; border: none; border-radius: 10px; cursor: pointer;
      background: transparent; color: var(--text-muted); transition: all 0.2s;
      font-weight: 700; font-size: 0.75rem; font-family: inherit;
    }
    .tab-toggle button.active {
      background: var(--bg-elevated); color: white;
      border: 1px solid rgba(16,185,129,0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* ── GPS Toggle Bar ── */
    .gps-bar {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 14px; border-radius: var(--radius);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.75rem;
    }
    .gps-bar .label { display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
    .gps-bar .label svg { color: var(--emerald); }
    .gps-bar .toggle-btn {
      padding: 4px 12px; border-radius: 8px; font-weight: 700; font-size: 0.7rem;
      border: 1px solid; cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .gps-bar .toggle-btn.inside { background: var(--emerald-bg); color: var(--emerald-light); border-color: rgba(16,185,129,0.2); }
    .gps-bar .toggle-btn.outside { background: var(--rose-bg); color: #f87171; border-color: rgba(239,68,68,0.2); }

    /* ── Active Mission Banner ── */
    .active-banner {
      background: var(--bg-primary); border: 2px solid rgba(16,185,129,0.3);
      padding: 20px; border-radius: var(--radius-xl);
      box-shadow: 0 4px 30px rgba(16,185,129,0.1);
    }
    .active-banner .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .badge-active { background: var(--emerald); color: #000; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; animation: pulse-dot 2s infinite; }
    .badge-heartbeat { font-size: 0.7rem; font-family: monospace; color: var(--emerald); display: flex; align-items: center; gap: 4px; }
    .active-banner h4 { font-weight: 800; font-size: 1rem; color: white; }
    .active-banner .site-name { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .active-banner textarea {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px; font-size: 0.75rem;
      color: white; resize: none; margin-top: 12px; font-family: inherit;
    }
    .active-banner textarea:focus { outline: none; border-color: var(--emerald); }
    .active-banner .notes-label { font-size: 0.68rem; font-weight: 600; color: var(--text-primary); margin-top: 16px; margin-bottom: 4px; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: var(--radius);
      font-size: 0.8rem; font-weight: 800; cursor: pointer; transition: all 0.2s;
      background: var(--emerald); color: #000; display: flex; align-items: center;
      justify-content: center; gap: 8px; box-shadow: 0 4px 20px var(--emerald-glow);
      margin-top: 12px; font-family: inherit;
    }
    .btn-primary:hover { background: var(--emerald-light); }
    .btn-primary:disabled { background: var(--bg-elevated); color: var(--text-dim); cursor: not-allowed; box-shadow: none; border: 1px solid var(--border-light); opacity: 0.6; }
    .btn-secondary {
      width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: var(--radius);
      font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
      background: var(--bg-elevated); color: var(--text-primary); display: flex;
      align-items: center; justify-content: space-between; font-family: inherit;
    }
    .btn-secondary:hover { background: var(--bg-hover); color: white; }
    .btn-secondary.verified { background: var(--emerald-bg); color: var(--emerald-light); border-color: rgba(16,185,129,0.2); }

    /* ── Section Headers ── */
    .section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding: 0 4px; margin-bottom: 12px; }

    /* ── Mission Cards ── */
    .mission-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 20px; border-radius: var(--radius); margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .mission-card.in-progress { border-color: rgba(16,185,129,0.4); }
    .mission-card .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .mission-card .site-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--emerald); }
    .mission-card .title { font-weight: 700; font-size: 0.85rem; color: white; margin-top: 2px; }
    .status-badge {
      font-size: 0.6rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid;
      white-space: nowrap;
    }
    .status-badge.planifiee { background: var(--bg-elevated); color: var(--text-muted); border-color: var(--border-light); }
    .status-badge.en-cours { background: var(--emerald-bg); color: var(--emerald-light); border-color: rgba(16,185,129,0.2); animation: pulse-dot 2s infinite; }
    .status-badge.terminee { background: var(--blue-bg); color: #60a5fa; border-color: rgba(59,130,246,0.2); }
    .status-badge.critique { background: var(--rose-bg); color: #f87171; border-color: rgba(239,68,68,0.2); }

    .mission-card .meta { font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; }
    .mission-card .meta strong { color: white; }
    .mission-card .meta .mono { font-family: monospace; color: var(--text-muted); }

    /* ── Geofence Status ── */
    .geofence-box {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.75rem; background: var(--bg-primary); padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--border); margin-top: 12px;
    }
    .geofence-box .label { color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .geofence-box .label svg { color: var(--emerald); }
    .geofence-box .value { font-family: monospace; font-weight: 700; }
    .geofence-box .value.inside { color: var(--emerald-light); }
    .geofence-box .value.outside { color: #f87171; }

    /* ── QR + Check-in Actions ── */
    .action-zone { padding-top: 12px; border-top: 1px solid var(--border); margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .qr-btn-inner { display: flex; align-items: center; gap: 8px; }

    /* ── Score Tab ── */
    .score-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 24px; border-radius: var(--radius); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .score-card .rank-circle {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 900; margin: 0 auto 12px;
    }
    .score-card .global-score { font-size: 1.2rem; font-weight: 800; color: white; text-align: center; }
    .score-card .global-sub { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 4px; }

    .score-breakdown {
      background: var(--bg-primary); padding: 16px; border-radius: var(--radius);
      border: 1px solid var(--border); margin-top: 20px;
    }
    .score-breakdown .breakdown-title { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 12px; }
    .score-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-bottom: 4px; }
    .score-row .label { color: var(--text-muted); }
    .score-row .value { font-family: monospace; font-weight: 700; }
    .score-row .value.quality { color: var(--amber); }
    .score-row .value.punctuality { color: var(--emerald-light); }
    .score-row .value.completion { color: var(--emerald-light); }
    .progress-bar { width: 100%; height: 6px; background: var(--bg-elevated); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar .fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
    .progress-bar .fill.quality { background: var(--amber); }
    .progress-bar .fill.punctuality { background: var(--emerald); }
    .progress-bar .fill.completion { background: var(--emerald-light); }

    /* ── Toast ── */
    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: var(--radius); font-size: 0.8rem; font-weight: 600;
      z-index: 9999; animation: toast-in 0.3s ease; max-width: 340px; text-align: center;
    }
    .toast-success { background: var(--emerald); color: #000; }
    .toast-error { background: var(--rose); color: white; }
    @keyframes toast-in { from { opacity:0; transform: translateX(-50%) translateY(-10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* ── Empty State ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state .title { font-size: 1rem; font-weight: 700; color: white; margin-bottom: 4px; }

    /* ── Version Badge ── */
    .version-bar { text-align: center; padding: 16px; font-size: 0.65rem; color: var(--text-dim); font-family: monospace; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Splash Screen -->
    <div id="splash">
      <div class="logo-box">N+</div>
      <div class="brand">NETPLUS <span>ERP</span></div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Force unregister old service workers on load -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) { reg.unregister(); });
      });
    }
  </script>
  <script src="/assets/netplus/pwa/app.js?v=3"></script>
</body>
</html>
